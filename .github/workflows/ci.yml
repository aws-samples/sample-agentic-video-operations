# Offline checks for every PR: no AWS credentials, no secrets, no deploys.
# Gate: just lint, just test and just docs-check (docs/build_a_sample.md §4).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.8.4"
          enable-cache: true
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0
        with:
          just-version: "1.58.0"
      - run: uv sync --frozen
      - run: just lint
      - run: just test
      # `just eval` joins in step 4a, when the first eval scenarios exist.
      - run: just docs-check

  cloudformation-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.8.4"
      # Add each sample's CloudFormation template here when the sample converts.
      - run: uvx cfn-lint==1.57.1 --non-zero-exit-code error samples/cmcd/cloudfront-cmcd-kinesis.yaml

  cdk-synth:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Add hydrolix in step 5, once `just deploy hydrolix` fetches mcp_hydrolix.
        app: [samples/hub/cdk, samples/medialive/cdk]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx cdk synth --quiet
