# Root of the uv workspace. One lock, one virtual environment, one set of tool settings.
# Python samples that share the lock are listed explicitly below.
[project]
name = "sample-agentic-video-operations"
version = "0.1.0"
license = "MIT-0"
requires-python = ">=3.12"
dependencies = ["media-ops-contracts", "media-ops-video-quality", "cmcd-mcp-server", "mediaconnect-mcp-server", "medialive-mcp-server", "agentic-iops-streaming", "hls-doctor"]

[dependency-groups]
# sqlglot: the Hydrolix runtime's SQL check, pinned exactly as in its requirements.txt.
dev = ["mypy>=1.14,<2", "pytest>=8.3,<9", "pyyaml>=6,<7", "ruff>=0.12,<0.13", "sqlglot==26.33.0"]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/media_ops_contracts",
  "packages/media_ops_video_quality",
  "samples/cmcd",
  "samples/mediaconnect",
  "samples/medialive",
  "samples/agentic-iops-streaming",
  "samples/hls-doctor",
]

[tool.uv.sources]
media-ops-contracts = { workspace = true }
media-ops-video-quality = { workspace = true }
cmcd-mcp-server = { workspace = true }
mediaconnect-mcp-server = { workspace = true }
medialive-mcp-server = { workspace = true }
agentic-iops-streaming = { workspace = true }
hls-doctor = { workspace = true }

[tool.ruff]
# Tool caches live under one ignored .cache/ directory, not in the repository root.
cache-dir = ".cache/ruff"
line-length = 100
target-version = "py312"
src = [
  "packages/media_ops_contracts/src",
  "packages/media_ops_video_quality/src",
  "samples/cmcd/src",
  "samples/mediaconnect/src",
  "samples/medialive/src",
  "samples/agentic-iops-streaming/src",
  "samples/hls-doctor/src",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests may assert and may construct fake credentials.
"**/tests/**" = ["S101", "S105", "S106"]
# Operator scripts run fixed-argv subprocesses (aws/cdk/git) and open the
# InfluxDB tunnel URL from validated settings; nothing user-supplied.
"scripts/*.py" = ["S310", "S603", "S607"]
# Fixed argv; the binary is resolved to an absolute path with shutil.which, and the
# URL argument is validated upstream by httpx URL parsing.
"samples/hls-doctor/src/hls_doctor/adapters/ffprobe/run_ffprobe.py" = ["S603"]
"samples/hls-doctor/src/hls_doctor/adapters/applevalidator/run_mediastreamvalidator.py" = ["S603"]
"samples/hls-doctor/src/hls_doctor/adapters/hlsjs/run_player_probe.py" = ["S603"]

# Non-strict baseline over the workspace packages; ratchet per package as they harden.
[tool.mypy]
cache_dir = ".cache/mypy"
files = [
  "packages/media_ops_contracts/src",
  "packages/media_ops_video_quality/src",
  "samples/cmcd/src",
  "samples/mediaconnect/src",
  "samples/medialive/src",
  "samples/agentic-iops-streaming/src",
  "samples/hls-doctor/src",
  "samples/hydrolix/cdk-hydrolix-data-assistant-agentcore-strands/hydrolix-data-assistant-agentcore-strands",
]
# The hydrolix deploy copies the upstream mcp_hydrolix package into src/mcp (gitignored,
# not this repository's code); it is checked upstream, not here.
exclude = ['^samples/hydrolix/.*/src/mcp/']
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

# Ratchet list: modules with pre-existing errors at mypy adoption. Fix a module,
# remove its entry; never add to this list.
[[tool.mypy.overrides]]
module = [
  "media_ops_contracts.domain_pack",
  "cmcd_mcp.adapters.influxdb.query_influxdb",
  "cmcd_mcp.adapters.influxdb.replay_influxdb_query",
  "agentic_iops_streaming.bootstrap.wrap_pack_tools",
  "agentic_iops_streaming.workflows.record_stream_events",
  "agentic_iops_streaming.workflows.run_agentic_iops_turn",
  "medialive_mcp.domain.metric_series",
  "medialive_mcp.tool_surface.create_read_tools",
  "medialive_mcp.tool_surface.create_write_tools",
]
ignore_errors = true

[tool.pytest.ini_options]
cache_dir = ".cache/pytest"
# Test paths for workspace packages and sample-specific suites.
testpaths = [
  "packages/media_ops_contracts/tests",
  "packages/media_ops_video_quality/tests",
  "scripts/tests",
  "samples/cmcd/tests",
  "samples/mediaconnect/tests",
  "samples/medialive/tests/scenarios",
  "samples/medialive/tests/pack",
  "samples/agentic-iops-streaming/tests/contract",
  "samples/agentic-iops-streaming/tests/eval",
  "samples/hls-doctor/tests",
]
pythonpath = ["scripts"]
addopts = "--strict-markers --tb=short -m 'not eval and not slow'"
# Third-party deprecations raised at import time by bedrock-agentcore and strands; not ours to fix.
filterwarnings = [
  "ignore:Support for class-based `config` is deprecated:DeprecationWarning",
  "ignore:strands.experimental.bidi is deprecated:DeprecationWarning",
  "ignore:strands.experimental.hooks.multiagent is deprecated:DeprecationWarning",
  "ignore::DeprecationWarning:botocore.*",
]
markers = [
  "eval: fixture-replay scenario evaluations (run with `just eval`)",
  "slow: starts real processes, so it takes a second or more (run with `just test-slow`; CI runs it)",
]
