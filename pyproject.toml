# Root of the uv workspace. One lock, one virtual environment, one set of tool settings.
# Each sample joins `members` (and leaves the ruff/pytest exclusions) when it is converted
# to docs/build_a_sample.md.
[project]
name = "sample-agentic-video-operations"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["media-ops-contracts", "cmcd-mcp-server", "mediaconnect-mcp-server", "medialive-mcp-server", "media-ops-hub"]

[dependency-groups]
dev = ["mypy>=1.14,<2", "pytest>=8.3,<9", "pyyaml>=6,<7", "ruff>=0.12,<0.13"]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/media_ops_contracts",
  "samples/cmcd",
  "samples/mediaconnect",
  "samples/medialive",
  "samples/hub",
]

[tool.uv.sources]
media-ops-contracts = { workspace = true }
cmcd-mcp-server = { workspace = true }
mediaconnect-mcp-server = { workspace = true }
medialive-mcp-server = { workspace = true }
media-ops-hub = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
src = [
  "packages/media_ops_contracts/src",
  "samples/cmcd/src",
  "samples/mediaconnect/src",
  "samples/medialive/src",
  "samples/hub/src",
]
# Unconverted samples; remove each entry in the step that converts the sample.
extend-exclude = [
  "samples/hydrolix",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests may assert and may construct fake credentials.
"**/tests/**" = ["S101", "S105", "S106"]
# Operator scripts run fixed-argv subprocesses (aws/cdk/git) and open the
# InfluxDB tunnel URL from validated settings; nothing user-supplied.
"scripts/*.py" = ["S310", "S603", "S607"]

# Non-strict baseline over the converted packages; ratchet per package as they harden.
# Same conversion contract as ruff: a sample joins `files` when it is converted.
[tool.mypy]
files = [
  "packages/media_ops_contracts/src",
  "samples/cmcd/src",
  "samples/mediaconnect/src",
  "samples/medialive/src",
  "samples/hub/src",
]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

# Ratchet list: modules with pre-existing errors at mypy adoption. Fix a module,
# remove its entry; never add to this list.
[[tool.mypy.overrides]]
module = [
  "media_ops_contracts.domain_pack",
  "cmcd_mcp.adapters.influxdb.query_influxdb",
  "cmcd_mcp.adapters.influxdb.replay_influxdb_query",
  "media_ops_hub.bootstrap.wrap_pack_tools",
  "media_ops_hub.workflows.record_stream_events",
  "media_ops_hub.workflows.run_hub_turn",
  "medialive_mcp.domain.metric_series",
  "medialive_mcp.tool_surface.create_read_tools",
  "medialive_mcp.tool_surface.create_write_tools",
]
ignore_errors = true

[tool.pytest.ini_options]
# Add each converted sample's tests/ directory here.
testpaths = [
  "packages/media_ops_contracts/tests",
  "scripts/tests",
  "samples/cmcd/tests",
  "samples/mediaconnect/tests",
  "samples/medialive/tests/scenarios",
  "samples/medialive/tests/pack",
  "samples/hub/tests/contract",
  "samples/hub/tests/eval",
]
pythonpath = ["scripts"]
addopts = "--strict-markers --tb=short -m 'not eval and not integration'"
# Third-party deprecations raised at import time by bedrock-agentcore and strands; not ours to fix.
filterwarnings = [
  "ignore:Support for class-based `config` is deprecated:DeprecationWarning",
  "ignore:strands.experimental.bidi is deprecated:DeprecationWarning",
  "ignore:strands.experimental.hooks.multiagent is deprecated:DeprecationWarning",
  "ignore::DeprecationWarning:botocore.*",
]
markers = [
  "eval: fixture-replay scenario evaluations (run with `just eval`)",
  "integration: needs a deployed stack and AWS credentials",
]
