# Root of the uv workspace. One lock, one virtual environment, one set of tool settings.
# Each sample joins `members` (and leaves the ruff/pytest exclusions) when it is converted
# to docs/build_a_sample.md.
[project]
name = "sample-agentic-video-operations"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["media-ops-contracts", "cmcd-mcp-server", "mediaconnect-mcp-server", "medialive-mcp-server", "media-ops-hub"]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.12,<0.13"]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/media_ops_contracts",
  "samples/cmcd",
  "samples/mediaconnect",
  "samples/medialive",
  "samples/hub",
]

[tool.uv.sources]
media-ops-contracts = { workspace = true }
cmcd-mcp-server = { workspace = true }
mediaconnect-mcp-server = { workspace = true }
medialive-mcp-server = { workspace = true }
media-ops-hub = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
src = [
  "packages/media_ops_contracts/src",
  "samples/cmcd/src",
  "samples/mediaconnect/src",
  "samples/medialive/src",
  "samples/hub/src",
]
# Unconverted samples; remove each entry in the step that converts the sample.
extend-exclude = [
  "samples/medialive/cdk",
  "samples/medialive/tests/local",
  "samples/medialive/tests/remote",
  "samples/medialive/tests/unit",  # ported onto the new package in G3.2
  # The legacy LangChain runtimes; the Strands hub in samples/hub/src replaces them.
  "samples/hub/cdk",
  "samples/hub/coordinator",
  "samples/hub/eml",
  "samples/hub/emx",
  "samples/hub/shared",
  "samples/hub/tests/*.py",
  "samples/hydrolix",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests may assert and may construct fake credentials.
"**/tests/**" = ["S101", "S105", "S106"]
# Operator scripts run fixed-argv subprocesses (aws/cdk/git) and open the
# InfluxDB tunnel URL from validated settings; nothing user-supplied.
"scripts/*.py" = ["S310", "S603", "S607"]

[tool.pytest.ini_options]
# Add each converted sample's tests/ directory here.
testpaths = [
  "packages/media_ops_contracts/tests",
  "scripts/tests",
  "samples/cmcd/tests",
  "samples/mediaconnect/tests",
  "samples/medialive/tests/scenarios",
  "samples/medialive/tests/pack",
  "samples/hub/tests/contract",
]
pythonpath = ["scripts"]
addopts = "--strict-markers --tb=short -m 'not eval and not integration'"
filterwarnings = [
  "ignore::DeprecationWarning:botocore.*",
]
markers = [
  "eval: fixture-replay scenario evaluations (run with `just eval`)",
  "integration: needs a deployed stack and AWS credentials",
]
