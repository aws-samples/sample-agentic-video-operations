AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFront distribution with CMCD field capture to Kinesis Data Streams'

Parameters:
  OriginDomainName:
    Type: String
    Description: Domain name of the origin server
    Default: example.com
  
  KinesisStreamName:
    Type: String
    Description: Name for the Kinesis Data Stream
    Default: cmcd-stream
  
  DatabaseName:
    Type: String
    Description: Timestream database name
    Default: cmcd-database
  
  TableName:
    Type: String
    Description: Timestream table name
    Default: cmcd-metrics

  S3BucketName:
    Type: String
    Description: Name for the S3 bucket (must be globally unique)
    Default: cmcd-content-bucket

  DeploymentArtifactsBucketName:
    Type: String
    Description: Existing S3 bucket used to package this template for deployment

  InfluxDBInstanceType:
    Type: String
    Description: Timestream for InfluxDB class; db.influx.medium is the smallest supported
    Default: db.influx.medium
    AllowedValues:
      - db.influx.medium
      - db.influx.large
      - db.influx.xlarge
      - db.influx.2xlarge
      - db.influx.4xlarge
      - db.influx.8xlarge
      - db.influx.12xlarge
      - db.influx.16xlarge
      - db.influx.24xlarge

  BastionInstanceType:
    Type: String
    Description: EC2 class for the SSM port-forwarding bastion
    Default: t3.nano
    AllowedValues:
      - t3.nano
      - t3.micro
      - t3.small



Resources:
  # KMS Key for S3 encryption
  S3KMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for S3 bucket encryption
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: Allow CloudFront Service
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:GenerateDataKey
            Resource: '*'

  S3KMSKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${AWS::StackName}-s3'
      TargetKeyId: !Ref S3KMSKey

  # S3 Bucket for content
  ContentBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${S3BucketName}-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref S3KMSKey
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # S3 Bucket Policy for CloudFront and Account Access
  ContentBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ContentBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub 
              - '${BucketArn}/*'
              - BucketArn: 
                  Fn::Sub:
                    - 'arn:aws:s3:::${BucketName}'
                    - BucketName:
                        !Ref ContentBucket
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CMCDCloudFrontDistribution}'

  

  # Origin Access Control for CloudFront
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-OAC'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # KMS Key for Kinesis encryption
  KinesisKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for Kinesis stream encryption
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'

  KinesisKMSKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${AWS::StackName}-kinesis'
      TargetKeyId: !Ref KinesisKMSKey

  # Kinesis Data Stream
  CMCDKinesisStream:
    Type: AWS::Kinesis::Stream
    Properties:
      Name: !Sub '${AWS::StackName}-${KinesisStreamName}'
      ShardCount: 1
      RetentionPeriodHours: 24
      StreamEncryption:
        EncryptionType: KMS
        KeyId: !Ref KinesisKMSKey

  # Managed Policy for CloudFront Kinesis access
  CloudFrontKinesisPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - kinesis:PutRecord
              - kinesis:PutRecords
            Resource: !GetAtt CMCDKinesisStream.Arn
          - Effect: Allow
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: !GetAtt KinesisKMSKey.Arn

  # IAM Role for CloudFront Real-time Logs
  CloudFrontLogsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref CloudFrontKinesisPolicy

  # CloudFront Real-time Log Configuration
  CMCDRealtimeLogConfig:
    Type: AWS::CloudFront::RealtimeLogConfig
    Properties:
      Name: !Sub '${AWS::StackName}-cmcd-realtime-logs'
      EndPoints:
        - StreamType: Kinesis
          KinesisStreamConfig:
            RoleArn: !GetAtt CloudFrontLogsRole.Arn
            StreamArn: !GetAtt CMCDKinesisStream.Arn
      Fields:
        - timestamp
        - c-ip
        - sc-status
        - cs-method
        - cs-uri-stem
        - cs-uri-query
        - cs-headers
        - time-taken
        - x-edge-location
        - x-edge-request-id
      SamplingRate: 100

  # WAF WebACL for CloudFront
  CloudFrontWebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub '${AWS::StackName}-cloudfront-waf'
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      Rules:
        - Name: AWSManagedRulesCommonRuleSet
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: CommonRuleSetMetric
        - Name: AWSManagedRulesKnownBadInputsRuleSet
          Priority: 2
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: KnownBadInputsRuleSetMetric
        - Name: RateLimitRule
          Priority: 3
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: 2000
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: RateLimitMetric
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub '${AWS::StackName}-WebACL'

  # CloudFront Distribution
  CMCDCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: 'CloudFront distribution with CMCD capture'
        DefaultRootObject: index.html
        WebACLId: !GetAtt CloudFrontWebACL.Arn
        Origins:
          - Id: s3-origin
            DomainName: !GetAtt ContentBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !Ref OriginAccessControl
          - Id: custom-origin
            DomainName: !Ref OriginDomainName
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: s3-origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
          OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf  # CORS-S3Origin
          ResponseHeadersPolicyId: 5cc3b908-e619-4b99-88e5-2cf7f45965bd  # CORS-With-Preflight
          RealtimeLogConfigArn: !GetAtt CMCDRealtimeLogConfig.Arn
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
          MinimumProtocolVersion: TLSv1.2_2021
        PriceClass: PriceClass_100

  # InfluxDB Password Secret (without endpoint reference to break circular dependency)
  InfluxDBSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub '${AWS::StackName}-influxdb-credentials'
      KmsKeyId: !Ref SecretsManagerKMSKey
      GenerateSecretString:
        SecretStringTemplate: !Sub |
          {
            "username": "admin",
            "organization": "cmcd-org",
            "bucket": "${TableName}"
          }
        GenerateStringKey: password
        PasswordLength: 16
        ExcludePunctuation: true
        ExcludeCharacters: '"@/\`'
        IncludeSpace: false
      Tags:
        - Key: Name
          Value: InfluxDBpassword

  # Processor-only secret. The token custom resource replaces this placeholder.
  InfluxDBProcessorSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub '${AWS::StackName}-influxdb-processor'
      KmsKeyId: !Ref SecretsManagerKMSKey
      SecretString: !Sub |
        {
          "endpoint": "",
          "organization": "cmcd-org",
          "bucket": "${TableName}",
          "writeToken": ""
        }
      Tags:
        - Key: Name
          Value: InfluxDBprocessor

  # Timestream for InfluxDB
  InfluxDBInstance:
    Type: AWS::Timestream::InfluxDBInstance
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      Name: !Sub '${DatabaseName}-${AWS::AccountId}'
      DbInstanceType: !Ref InfluxDBInstanceType
      AllocatedStorage: 20
      Bucket: !Ref TableName
      Organization: cmcd-org
      Username: admin
      Password: !Sub '{{resolve:secretsmanager:${InfluxDBSecret}:SecretString:password}}'
      VpcSubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      VpcSecurityGroupIds:
        - !Ref InfluxDBSecurityGroup
      PubliclyAccessible: false

  # VPC for InfluxDB
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true

  # Internet Gateway
  InternetGateway:
    Type: AWS::EC2::InternetGateway

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # Public Subnet for Bastion Host
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.0.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true

  # Private Subnets
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']

  # Route Tables
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  # Keep the custom resource's CloudFormation response path available during teardown.
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Gateway
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcId: !Ref VPC
      RouteTableIds:
        - !Ref PrivateRouteTable
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SendCloudFormationCustomResourceResponse
            Effect: Allow
            Principal: '*'
            Action: s3:PutObject
            Resource:
              Fn::Sub:
                - 'arn:${AWS::Partition}:s3:::cloudformation-custom-resource-response-${RegionWithoutDashes}/*'
                - RegionWithoutDashes:
                    Fn::Join:
                      - ''
                      - Fn::Split:
                          - '-'
                          - !Ref AWS::Region
          - Sid: ReadStackBucketMetadata
            Effect: Allow
            Principal: '*'
            Condition:
              StringEquals:
                aws:PrincipalAccount: !Sub '${AWS::AccountId}'
            Action:
              - s3:GetBucketLocation
              - s3:ListBucket
            Resource:
              - !GetAtt ContentBucket.Arn
              - !Sub 'arn:${AWS::Partition}:s3:::${DeploymentArtifactsBucketName}'
          - Sid: AccessStackBucketObjects
            Effect: Allow
            Principal: '*'
            Condition:
              StringEquals:
                aws:PrincipalAccount: !Sub '${AWS::AccountId}'
            Action:
              - s3:DeleteObject
              - s3:GetObject
              - s3:PutObject
            Resource:
              - !Sub '${ContentBucket.Arn}/*'
              - !Sub 'arn:${AWS::Partition}:s3:::${DeploymentArtifactsBucketName}/*'

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # Security Group for InfluxDB
  InfluxDBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for InfluxDB instance
      VpcId: !Ref VPC

  # Security Group for Lambda
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Lambda function
      VpcId: !Ref VPC

  # Private AWS API path for the two Lambdas; no NAT gateway is required.
  SecretsManagerEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow CMCD Lambdas to use the Secrets Manager VPC endpoint
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref LambdaSecurityGroup

  SecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.secretsmanager'
      VpcId: !Ref VPC
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref SecretsManagerEndpointSecurityGroup
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AccessStackInfluxDBSecrets
            Effect: Allow
            Principal: '*'
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:UpdateSecret
            Resource:
              - !Ref InfluxDBSecret
              - !Ref InfluxDBProcessorSecret
            Condition:
              StringEquals:
                aws:PrincipalAccount: !Ref AWS::AccountId

  # Security Group for Bastion Host
  BastionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Bastion Host
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 8086
          ToPort: 8086
          DestinationSecurityGroupId: !Ref InfluxDBSecurityGroup

  # Security Group Rules for InfluxDB access
  LambdaToInfluxDBRule:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref InfluxDBSecurityGroup
      IpProtocol: tcp
      FromPort: 8086
      ToPort: 8086
      SourceSecurityGroupId: !Ref LambdaSecurityGroup

  BastionToInfluxDBIngressRule:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref InfluxDBSecurityGroup
      IpProtocol: tcp
      FromPort: 8086
      ToPort: 8086
      SourceSecurityGroupId: !Ref BastionSecurityGroup

  # KMS Key for Secrets Manager encryption
  SecretsManagerKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for Secrets Manager encryption
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'

  SecretsManagerKMSKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${AWS::StackName}-secrets-manager'
      TargetKeyId: !Ref SecretsManagerKMSKey

  # Lambda function for secret rotation
  SecretRotationLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-secret-rotation'
      Runtime: python3.13
      Handler: index.lambda_handler
      Code:
        ZipFile: |
          import json
          def lambda_handler(event, context):
              return {'statusCode': 200, 'body': json.dumps('Secret rotation placeholder')}
      Role: !GetAtt SecretRotationLambdaRole.Arn

  # Provision least-privilege InfluxDB tokens and prove both paths work.
  UpdateSecretLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-provision-influxdb-tokens'
      Runtime: python3.13
      Handler: index.lambda_handler
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet1
          - !Ref PrivateSubnet2
      Code:
        ZipFile: !Sub |
          import base64
          import json
          import ssl
          import time
          from http.cookiejar import CookieJar
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import HTTPCookieProcessor, HTTPSHandler, Request, build_opener

          import boto3
          import cfnresponse

          READ_DESCRIPTION = "cmcd-mcp-server read-only"
          WRITE_DESCRIPTION = "cmcd-kinesis-processor write-only"
          ADMIN_SECRET_ARN = "${InfluxDBSecret}"
          PROCESSOR_SECRET_ARN = "${InfluxDBProcessorSecret}"
          PHYSICAL_RESOURCE_ID = "${AWS::StackName}-influxdb-tokens"
          RESPONSE_BUFFER_MILLIS = 15_000

          def remaining_seconds(context):
              return max(
                  0.0,
                  (context.get_remaining_time_in_millis() - RESPONSE_BUFFER_MILLIS) / 1000,
              )

          def wait_before_retry(context, seconds):
              wait_seconds = min(seconds, remaining_seconds(context) - 1)
              if wait_seconds <= 0:
                  raise TimeoutError("InfluxDB provisioning deadline reached")
              time.sleep(wait_seconds)

          def request(
              opener,
              url,
              context,
              *,
              method="GET",
              headers=None,
              data=None,
              attempts=3,
              retry_delay=5,
          ):
              last_error = None
              for attempt in range(attempts):
                  timeout = min(15, remaining_seconds(context))
                  if timeout < 1:
                      raise TimeoutError("InfluxDB provisioning deadline reached")
                  try:
                      with opener.open(
                          Request(url, method=method, headers=headers or {}, data=data),
                          timeout=timeout,
                      ) as response:
                          return response.status, response.read()
                  except HTTPError as error:
                      if error.code == 401:
                          raise RuntimeError(
                              "InfluxDB authentication failed with HTTP 401; "
                              "verify the admin credentials or token permissions"
                          ) from error
                      if not 500 <= error.code < 600:
                          raise
                      last_error = error
                      if attempt + 1 < attempts:
                          wait_before_retry(context, retry_delay)
                  except (URLError, TimeoutError) as error:
                      last_error = error
                      if attempt + 1 < attempts:
                          wait_before_retry(context, retry_delay)
              raise last_error

          def read_json(opener, url, context):
              status, body = request(opener, url, context)
              if status != 200:
                  raise RuntimeError(f"InfluxDB lookup failed with HTTP {status}")
              return json.loads(body)

          def find_id(items, name):
              match = next((item for item in items if item.get("name") == name), None)
              if not match:
                  raise RuntimeError(f"InfluxDB resource {name!r} was not found")
              return match["id"]

          def permission(action, org_id, bucket_id):
              return {
                  "action": action,
                  "resource": {
                      "type": "buckets",
                      "id": bucket_id,
                      "orgID": org_id,
                  },
              }

          def has_permission(authorization, action, org_id, bucket_id):
              permissions = authorization.get("permissions")
              if not isinstance(permissions, list) or len(permissions) != 1:
                  return False
              candidate = permissions[0]
              resource = candidate.get("resource", {})
              return (
                  candidate.get("action") == action
                  and resource.get("type") == "buckets"
                  and resource.get("id") == bucket_id
                  and resource.get("orgID") == org_id
              )

          def find_token(opener, endpoint, org_id, bucket_id, description, action, context):
              existing = read_json(
                  opener,
                  f"{endpoint}/api/v2/authorizations?{urlencode({'orgID': org_id})}",
                  context,
              ).get("authorizations", [])
              match = next(
                  (
                      authorization
                      for authorization in existing
                      if authorization.get("description") == description
                      and has_permission(authorization, action, org_id, bucket_id)
                      and authorization.get("token")
                  ),
                  None,
              )
              return match["token"] if match else None

          def find_or_create_token(
              opener,
              endpoint,
              org_id,
              bucket_id,
              description,
              action,
              context,
              *,
              attempts=3,
          ):
              payload = json.dumps({
                  "orgID": org_id,
                  "description": description,
                  "permissions": [permission(action, org_id, bucket_id)],
              }).encode()
              for attempt in range(attempts):
                  token = find_token(
                      opener, endpoint, org_id, bucket_id, description, action, context
                  )
                  if token:
                      return token
                  # One POST per lookup: a lost response may still have created the token,
                  # so a retry looks it up by description first instead of adding a duplicate.
                  try:
                      status, body = request(
                          opener,
                          f"{endpoint}/api/v2/authorizations",
                          context,
                          method="POST",
                          headers={"Content-Type": "application/json"},
                          data=payload,
                          attempts=1,
                      )
                  except HTTPError as error:
                      if not 500 <= error.code < 600 or attempt + 1 == attempts:
                          raise
                      wait_before_retry(context, 5)
                      continue
                  except (URLError, TimeoutError):
                      if attempt + 1 == attempts:
                          raise
                      wait_before_retry(context, 5)
                      continue
                  if status != 201:
                      raise RuntimeError(
                          f"InfluxDB token creation for {description!r} failed with HTTP {status}"
                      )
                  return json.loads(body)["token"]
              raise RuntimeError(f"InfluxDB token creation for {description!r} did not finish")

          def prove_write_and_read(opener, endpoint, secret, context):
              write_url = f"{endpoint}/api/v2/write?{urlencode({
                  'org': secret['organization'],
                  'bucket': secret['bucket'],
                  'precision': 'ns',
              })}"
              status, _ = request(
                  opener,
                  write_url,
                  context,
                  method="POST",
                  headers={
                      "Authorization": f"Token {secret['writeToken']}",
                      "Content-Type": "text/plain",
                  },
                  data=b"cmcd_deploy_smoke,source=cloudformation value=1i",
              )
              if status != 204:
                  raise RuntimeError(f"InfluxDB deployment smoke write failed with HTTP {status}")
              query = (
                  f'from(bucket: "{secret["bucket"]}")'
                  ' |> range(start: -5m)'
                  ' |> filter(fn: (r) => r["_measurement"] == "cmcd_deploy_smoke")'
                  " |> limit(n: 1)"
              ).encode()
              for attempt in range(5):
                  status, body = request(
                      opener,
                      f"{endpoint}/api/v2/query?{urlencode({'org': secret['organization']})}",
                      context,
                      method="POST",
                      headers={
                          "Authorization": f"Token {secret['readToken']}",
                          "Content-Type": "application/vnd.flux",
                      },
                      data=query,
                  )
                  if status == 200 and b"cmcd_deploy_smoke" in body:
                      return
                  if attempt < 4:
                      wait_before_retry(context, 2)
              raise RuntimeError("InfluxDB deployment smoke read did not return the written point")

          def lambda_handler(event, context):
              if event["RequestType"] == "Delete":
                  cfnresponse.send(
                      event,
                      context,
                      cfnresponse.SUCCESS,
                      {"TokensProvisioned": False},
                      physicalResourceId=PHYSICAL_RESOURCE_ID,
                  )
                  return
              try:
                  if event["RequestType"] in ("Create", "Update"):
                      secrets_client = boto3.client('secretsmanager')
                      response = secrets_client.get_secret_value(SecretId=ADMIN_SECRET_ARN)
                      secret_dict = json.loads(response["SecretString"])
                      endpoint = f"https://{event['ResourceProperties']['InfluxDBEndpoint']}:8086"
                      tls_context = ssl.create_default_context()
                      opener = build_opener(
                          HTTPSHandler(context=tls_context),
                          HTTPCookieProcessor(CookieJar()),
                      )
                      basic = base64.b64encode(
                          f"{secret_dict['username']}:{secret_dict['password']}".encode()
                      ).decode()
                      status, _ = request(
                          opener,
                          f"{endpoint}/api/v2/signin",
                          context,
                          method="POST",
                          headers={"Authorization": f"Basic {basic}"},
                          attempts=18,
                      )
                      if status != 204:
                          raise RuntimeError(f"InfluxDB sign-in failed with HTTP {status}")
                      org_id = find_id(
                          read_json(
                              opener,
                              f"{endpoint}/api/v2/orgs?{urlencode({'org': secret_dict['organization']})}",
                              context,
                          )["orgs"],
                          secret_dict["organization"],
                      )
                      bucket_id = find_id(
                          read_json(
                              opener,
                              f"{endpoint}/api/v2/buckets?{urlencode({
                                  'name': secret_dict['bucket'],
                                  'orgID': org_id,
                              })}",
                              context,
                          )["buckets"],
                          secret_dict["bucket"],
                      )
                      secret_dict["endpoint"] = endpoint
                      secret_dict["readToken"] = find_or_create_token(
                          opener,
                          endpoint,
                          org_id,
                          bucket_id,
                          READ_DESCRIPTION,
                          "read",
                          context,
                      )
                      secret_dict.pop("writeToken", None)
                      write_token = find_or_create_token(
                          opener,
                          endpoint,
                          org_id,
                          bucket_id,
                          WRITE_DESCRIPTION,
                          "write",
                          context,
                      )
                      secrets_client.update_secret(
                          SecretId=ADMIN_SECRET_ARN,
                          SecretString=json.dumps(secret_dict),
                      )
                      processor_secret = {
                          "endpoint": endpoint,
                          "organization": secret_dict["organization"],
                          "bucket": secret_dict["bucket"],
                          "writeToken": write_token,
                      }
                      secrets_client.update_secret(
                          SecretId=PROCESSOR_SECRET_ARN,
                          SecretString=json.dumps(processor_secret),
                      )
                      prove_write_and_read(
                          opener,
                          endpoint,
                          {**secret_dict, "writeToken": write_token},
                          context,
                      )
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {
                      "TokensProvisioned": True,
                  }, physicalResourceId=PHYSICAL_RESOURCE_ID)
              except Exception as error:
                  print(f"InfluxDB token provisioning failed: {error}")
                  cfnresponse.send(event, context, cfnresponse.FAILED, {
                      "Error": "InfluxDB token provisioning or smoke verification failed",
                  }, physicalResourceId=PHYSICAL_RESOURCE_ID)
