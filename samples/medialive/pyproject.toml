[project]
name = "medialive-mcp-server"
version = "0.2.0"
description = "MediaLive channel health and control as an MCP server and media-ops domain pack."
license = "MIT-0"
requires-python = ">=3.12"
dependencies = [
  "media-ops-contracts",
  "media-ops-video-quality",
  "boto3>=1.35,<2",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "fastmcp>=3.2,<4",
]

[project.scripts]
serve-medialive = "medialive_mcp.entrypoints.serve_mcp:main"

[project.entry-points."media_ops.domain_packs"]
medialive = "medialive_mcp.domain_pack:create_domain_pack"

[tool.uv.sources]
media-ops-contracts = { workspace = true }
media-ops-video-quality = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "medialive_mcp"
