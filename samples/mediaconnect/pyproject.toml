[project]
name = "mediaconnect-mcp-server"
version = "0.1.0"
description = "MCP tools for AWS Elemental MediaConnect operations and diagnostics."
license = "MIT-0"
requires-python = ">=3.12"
dependencies = [
  "botocore>=1.35,<2",
  "fastmcp>=3.2,<4",
  "media-ops-contracts",
  "media-ops-video-quality",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
]

[project.scripts]
serve-mediaconnect = "mediaconnect_mcp.entrypoints.serve_mcp:main"

[project.entry-points."media_ops.domain_packs"]
mediaconnect = "mediaconnect_mcp.domain_pack:create_domain_pack"

[tool.uv.sources]
media-ops-contracts = { workspace = true }
media-ops-video-quality = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mediaconnect_mcp"
